<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>错题本 - 成长OS</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
<div class="header-row">
<div>
<h1>错题本</h1>
<p><a href="index.html" class="back-link">← 返回首页</a></p>
</div>
<div class="user-box">
<span id="usernameDisplay"></span>
<button onclick="doLogout()">退出登录</button>
</div>
</div>
</header>

<section class="page-body">

<div class="card wide">
<h2>添加错题</h2>
<div class="form-row">
<input type="text" id="subject" placeholder="科目，如 Python">
</div>
<div class="form-row">
<textarea id="question" placeholder="题目内容" rows="2" style="flex:1;padding:8px;border:1px solid #ddd;border-radius:8px;"></textarea>
</div>
<div class="form-row">
<input type="text" id="myAnswer" placeholder="我的答案">
<input type="text" id="correctAnswer" placeholder="正确答案">
</div>
<div class="form-row">
<input type="text" id="note" placeholder="错因/笔记(可选)" style="flex:1">
<button onclick="addWrongQuestion()">加入错题本</button>
</div>
<p class="auth-msg" id="msg"></p>
</div>

<div class="card wide">
<h2>未掌握 <span id="unmasteredCount"></span></h2>
<ul id="unmasteredList"><li>加载中...</li></ul>
</div>

<div class="card wide">
<h2>已掌握</h2>
<ul id="masteredList"></ul>
</div>

</section>

<script src="js/common.js"></script>
<script src="js/wrongbook.js"></script>

</body>
</html>
