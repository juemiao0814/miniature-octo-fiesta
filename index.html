<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>3D云游郑州大观音寺</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#0c0a14;font-family:"Noto Serif SC","Songti SC",SimSun,serif;color:#f0e2c0;touch-action:none}
canvas{display:block}
#start{position:fixed;inset:0;background:radial-gradient(#3a2418,#0c0a14);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:9;text-align:center;padding:20px}
#start h1{color:#e8c36a;letter-spacing:8px;font-size:30px}
#start p{opacity:.7;font-size:13px;letter-spacing:2px}
input{background:#14100c;border:1px solid #6a5230;color:#f0e2c0;padding:10px 14px;border-radius:8px;font:inherit;width:240px;text-align:center}
.cols{display:flex;gap:10px}
.cols button{width:70px;padding:8px 0;border-radius:18px;border:2px solid #6a5230;color:#fff;font:inherit;cursor:pointer;font-size:13px}
.cols button.on{border-color:#e8c36a;box-shadow:0 0 12px #e8c36a}
.go{background:#8a2f1f;color:#fff;border:1px solid #e8c36a;padding:10px 30px;border-radius:24px;font:inherit;cursor:pointer;letter-spacing:4px;margin:4px}
#hud{position:fixed;top:10px;left:12px;font-size:12px;line-height:1.7;opacity:.85;text-shadow:0 1px 4px #000;pointer-events:none}
#quest{position:fixed;top:10px;right:12px;background:#0008;border:1px solid #6a5230;border-radius:10px;padding:8px 12px;font-size:12px;line-height:1.8;pointer-events:none}
#quest b{color:#e8c36a;display:block;margin-bottom:2px}
#quest .ok{color:#8fe08f;text-decoration:line-through;opacity:.8}
#act{position:fixed;bottom:34px;left:50%;transform:translateX(-50%);display:none;background:#8a2f1f;color:#fff;border:1px solid #e8c36a;padding:12px 30px;border-radius:26px;font:inherit;font-size:16px;letter-spacing:3px;cursor:pointer;z-index:5}
#toast{position:fixed;top:16%;left:50%;transform:translateX(-50%);background:#000b;border:1px solid #e8c36a;padding:10px 22px;border-radius:10px;opacity:0;transition:.4s;pointer-events:none;text-align:center;max-width:85%;z-index:6}
#music{position:fixed;top:56px;left:12px;z-index:7;display:flex;align-items:center;gap:8px;background:#0008;border:1px solid #6a5230;border-radius:20px;padding:5px 12px;font-size:13px}
#music button{background:none;border:0;color:#f0e2c0;font:inherit;cursor:pointer;letter-spacing:2px}
#music input[type=range]{width:70px;padding:0;border:0;background:none;accent-color:#e8c36a}
#music.on #mnote{animation:spin 3s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
#joy{position:fixed;left:24px;bottom:30px;width:120px;height:120px;border-radius:50%;background:#ffffff18;border:1px solid #ffffff40;display:none}
#knob{position:absolute;left:40px;top:40px;width:40px;height:40px;border-radius:50%;background:#ffffff70}
#modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:8}
#modal .card{background:#1d1610;border:1px solid #e8c36a;border-radius:14px;padding:24px;max-width:340px;width:88%;text-align:center;line-height:1.8}
#modal h3{color:#e8c36a;letter-spacing:4px;margin-bottom:8px}
#modal p{font-size:14px;margin-bottom:12px;opacity:.9}
@media(pointer:coarse){#joy{display:block}#act{bottom:170px;left:auto;right:20px;transform:none}#hud{display:none}}
</style>
</head>

<div id="start">
  <h1>云游大观音寺</h1>
  <p>塑一个自己，入寺走一走</p>
  <input id="nm" maxlength="8" placeholder="你的名字" value="游客">
  <div class="cols" id="cols">
    <button data-c="0x3f8f8a" style="background:#3f8f8a" class="on">青衣</button>
    <button data-c="0xe8e4d8" style="background:#b8b2a0">素白</button>
    <button data-c="0xd9a441" style="background:#d9a441">杏黄</button>
  </div>
  <button class="go" id="go">入　寺</button>
</div>

<div id="music"><button id="mbtn"><span id="mnote">♪</span> <span id="mtxt">音乐：关</span></button><input type="range" id="mvol" min="0" max="100" value="50" title="音量"></div>
<input type="file" id="mfile" accept="audio/*" style="display:none">

<div id="quest"></div>
<button id="act"></button>
<div id="toast"></div>
<div id="joy"><div id="knob"></div></div>
<div id="modal"><div class="card"><h3 id="mt"></h3><p id="mp"></p><input id="mi" maxlength="24" placeholder="写下你的心愿"><div><button class="go" id="mok">确定</button><button class="go" id="mc" style="background:#3a3228">关闭</button></div></div></div>

<script>

/* ========== 渲染器与贴图 ========== */
const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,400);
const ren=new THREE.WebGLRenderer({antialias:true});
ren.setSize(innerWidth,innerHeight);ren.setPixelRatio(Math.min(devicePixelRatio,2));
ren.outputEncoding=THREE.sRGBEncoding;ren.toneMapping=THREE.ACESFilmicToneMapping;ren.toneMappingExposure=1.15;

scene.fog=new THREE.FogExp2(0x15101c,.016);

function tex(w,h,draw,rx=1,ry=1){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);
 const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx,ry);t.encoding=THREE.sRGBEncoding;t.anisotropy=4;return t}
const mkGrass=(rx,ry)=>tex(256,256,(c,w,h)=>{c.fillStyle='#2f5030';c.fillRect(0,0,w,h);for(let i=0;i<3000;i++){c.fillStyle=`hsl(${90+rnd()*35},${30+rnd()*25}%,${14+rnd()*16}%)`;c.fillRect(rnd()*w,rnd()*h,2,4)}},rx,ry);
const mkStone=(rx,ry,b=46)=>tex(256,256,(c,w,h)=>{c.fillStyle=`hsl(35,5%,${b-20}%)`;c.fillRect(0,0,w,h);for(let y=0;y<4;y++)for(let x=0;x<4;x++){c.fillStyle=`hsl(35,${4+rnd()*6}%,${b+rnd()*14}%)`;c.fillRect(x*64+2,y*64+2,60,60)}for(let i=0;i<700;i++){c.fillStyle=`rgba(0,0,0,${rnd()*.14})`;c.fillRect(rnd()*w,rnd()*h,2,2)}},rx,ry);
const mkTile=(rx,ry)=>tex(128,128,(c,w,h)=>{c.fillStyle='#3a474e';c.fillRect(0,0,w,h);for(let x=0;x<w;x+=16){c.fillStyle='#232d33';c.fillRect(x,0,3,h)}for(let y=0;y<h;y+=16){c.fillStyle='#4a5a62';c.fillRect(0,y,w,2)}},rx,ry);
const mkRed=(rx,ry)=>tex(128,128,(c,w,h)=>{c.fillStyle='#9a2f22';c.fillRect(0,0,w,h);for(let i=0;i<60;i++){c.fillStyle=`rgba(${rnd()<.5?'0,0,0':'255,160,120'},${rnd()*.1})`;c.fillRect(rnd()*w,0,1+rnd()*2,h)}},rx,ry);
const mkSky=(stops)=>tex(8,256,(c,w,h)=>{const g=c.createLinearGradient(0,0,0,h);stops.forEach((s,i)=>g.addColorStop(i/(stops.length-1),s));c.fillStyle=g;c.fillRect(0,0,w,h)});

const M=(c,e=0,map=null)=>new THREE.MeshStandardMaterial({color:c,roughness:.85,emissive:e,emissiveIntensity:e?1:0,map});
function put(m,p,x,y,z,sh=true){m.position.set(x,y,z);m.castShadow=sh;m.receiveShadow=true;p.add(m);return m}
const box=(w,h,d,c,x,y,z,p=scene,e=0,map=null)=>put(new THREE.Mesh(new THREE.BoxGeometry(w,h,d),M(c,e,map)),p,x,y,z);
const cyl=(rt,rb,h,c,x,y,z,p=scene,seg=16,e=0,map=null)=>put(new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg),M(c,e,map)),p,x,y,z);
const sph=(r,c,x,y,z,p=scene,e=0)=>put(new THREE.Mesh(new THREE.SphereGeometry(r,16,12),M(c,e)),p,x,y,z);
const cone=(r,h,c,x,y,z,p=scene,seg=8,e=0)=>put(new THREE.Mesh(new THREE.ConeGeometry(r,h,seg),M(c,e)),p,x,y,z);

const tileT=mkTile(8,2);
function roof(rb,rt,h,sz,x,y,z,p){const m=put(new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,4),M(0xffffff,0,tileT)),p,x,y,z);m.rotation.y=Math.PI/4;m.scale.z=sz;
 const a=rb/Math.SQRT2;[-1,1].forEach(sx=>[-1,1].forEach(s2=>{const c=cone(.3,1.8,0x2a3238,sx*a,y-h/2+.3,s2*a*sz,p);c.rotation.z=-sx*.7;c.rotation.x=s2*.7}))}

/* ========== 光照、天空、昼夜 ========== */
const hemi=new THREE.HemisphereLight(0x7080b8,0x2a1c14,.75);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xbcc8ff,.45);sun.position.set(-30,60,25);sun.castShadow=true;
sun.shadow.mapSize.set(coarse()?1024:2048,coarse()?1024:2048);Object.assign(sun.shadow.camera,{left:-70,right:70,top:70,bottom:-70,near:1,far:200});sun.shadow.bias=-.0005;scene.add(sun);

 g.setAttribute('position',new THREE.Float32BufferAttribute(a,3));const p=new THREE.Points(g,new THREE.PointsMaterial({color:0xfff2c8,size:1.4,fog:false,sizeAttenuation:false}));scene.add(p);return p})();
const moonM=new THREE.Mesh(new THREE.SphereGeometry(9,24,16),new THREE.MeshBasicMaterial({color:0xfff3c8,fog:false}));moonM.position.set(-120,130,-200);scene.add(moonM);
function setTime(n){night=n;sky.material.map=skyT[n?0:1];scene.fog.color.set(n?0x15101c:0xb4c6d8);scene.fog.density=n?.016:.008;
 hemi.intensity=n?.75:1.15;hemi.color.set(n?0x7080b8:0xd0e0ff);sun.color.set(n?0xbcc8ff:0xfff0d0);sun.intensity=n?.45:1.6;
 stars.visible=moonM.visible=n;pl.forEach(l=>l.intensity=l.userData.b*(n?1:.15));scene.background=null}
const LS=()=>night?1:.15;

/* ========== 碰撞 ========== */
const col=[],cc=(x,z,r)=>col.push({t:0,x,z,r}),cb=(x,z,hx,hz)=>col.push({t:1,x,z,hx,hz});
function resolve(p,pr){for(let k=0;k<2;k++)for(const c of col){
 if(c.t===0){const dx=p.x-c.x,dz=p.z-c.z,d=Math.hypot(dx,dz),m=c.r+pr;if(d<m){if(d<1e-4)p.x+=m;else{p.x+=dx/d*(m-d);p.z+=dz/d*(m-d)}}}
 else{const qx=Math.max(c.x-c.hx,Math.min(p.x,c.x+c.hx)),qz=Math.max(c.z-c.hz,Math.min(p.z,c.z+c.hz)),dx=p.x-qx,dz=p.z-qz,d=Math.hypot(dx,dz);
  if(d<pr){if(d>1e-4){p.x+=dx/d*(pr-d);p.z+=dz/d*(pr-d)}else{const ox=c.hx-Math.abs(p.x-c.x),oz=c.hz-Math.abs(p.z-c.z);if(ox<oz)p.x+=(p.x>c.x?1:-1)*(ox+pr);else p.z+=(p.z>c.z?1:-1)*(oz+pr)}}}}}
function hgt(x,z){if(Math.abs(x)<13&&z<.5&&z>-16.5)return .9;if(Math.abs(x)<4&&z>=.5&&z<2.9)return .9*(2.9-z)/2.4;return 0}

/* ========== 地面、路、围墙 ========== */
{const g=new THREE.Mesh(new THREE.PlaneGeometry(300,300),M(0xffffff,0,mkGrass(70,70)));g.rotation.x=-Math.PI/2;g.receiveShadow=true;scene.add(g)}
const sT=()=>mkStone(4,40);box(7,.1,92,0xffffff,0,.05,0,scene,0,mkStone(3,38));
box(50,.1,26,0xffffff,0,.04,-6,scene,0,mkStone(22,12));box(46,.1,24,0xffffff,0,.06,-30,scene,0,mkStone(20,10));
[-18,18].forEach(x=>box(3.5,.1,40,0xffffff,x,.05,-8,scene,0,mkStone(2,18)));
// 围墙（山门两侧）
[-1,1].forEach(s=>{const wx=s*25;box(41,3.6,.9,0xd8cdb8,wx,1.8,38,scene);box(41.6,.5,1.4,0x2e3a40,wx,3.8,38,scene);cb(wx,38,20.5,.6)});
// 山门
{const g=new THREE.Group();g.position.set(0,0,38);scene.add(g);const red=mkRed(1,3);
 [-3.6,3.6].forEach(x=>{cyl(.5,.55,7,0xffffff,x,3.5,0,g,16,0,red);cc(x,38,.7)});
 box(9.6,.8,1.2,0x7a2418,0,6.6,0,g);box(8,1.8,.6,0x2a1a15,0,7.9,0,g,0x4a2a08);
 roof(7.6,3.2,2.6,.4,0,10,0,g);[-1,1].forEach(s=>{const l=sph(.45,0xd4401f,s*2,5.3,0,g,0xd4401f);l.scale.y=1.2});
 warm(0,5,36,.9,20)}

/* ========== 大雄宝殿 ========== */
{const g=new THREE.Group();g.position.set(0,0,-8);scene.add(g);const red=mkRed(4,1),st=mkStone(8,5,50);
 box(26,.9,17,0xffffff,0,.45,0,g,0,st);
 box(22,7,.8,0xffffff,0,4.4,-6,g,0,red);[-10.6,10.6].forEach(x=>box(.8,7,12,0xffffff,x,4.4,0,g,0,red));
 for(let i=0;i<6;i++){const x=-10+i*4;cyl(.4,.45,7,0xffffff,x,4.4,6,g,16,0,red);cc(x,-2,.55);const l=sph(.4,0xd4401f,x,7.2,6.9,g,0xd4401f);l.scale.y=1.25}
 box(22.8,.7,1,0x6a1f16,0,8.25,6,g);box(27.4,.35,17.4,0x2e1a14,0,8.05,0,g);
 roof(19,11,4,.62,0,9.9,0,g);box(15,2.4,9.4,0xffffff,0,13.1,0,g,0,red);box(18,.3,11.4,0x2e1a14,0,14.4,0,g);
 roof(12.5,.3,4.5,.62,0,16.55,0,g);sph(.6,0xe8c36a,0,19,0,g,0x9a7a20);cyl(.15,.15,1.5,0xe8c36a,0,18.3,0,g,8,0x9a7a20);
 // 踏步与栏杆
 [[.3,2.5],[.6,1.7],[.9,.9]].forEach(([h,z])=>box(8,h,.8,0xffffff,0,h/2,z,scene,0,st));
 [[-8.7,.5,8.6,.25],[8.7,.5,8.6,.25]].forEach(([x,z,w,d])=>box(w,.6,d,0xcfc6b4,x,1.2,z,scene));
 [-1,1].forEach(s=>box(.25,.6,17,0xcfc6b4,s*13,1.2,-8,scene));box(26,.6,.25,0xcfc6b4,0,1.2,-16.5,scene);
 // 碰撞：墙、平台边
 cb(0,-14,11,.6);cb(-10.6,-8,.6,6);cb(10.6,-8,.6,6);cb(-13.5,-8,.5,8.8);cb(13.5,-8,.5,8.8);cb(0,-17,14,.5);cb(-8.8,.9,4.8,.4);cb(8.8,.9,4.8,.4);
 // 殿内：佛像、供桌
 const b=new THREE.Group();b.position.set(0,.9,-12.8);b.scale.setScalar(1.3);scene.add(b);
 cyl(2.2,2.5,.7,0xcfa84a,0,.35,0,b,20,0x5a4010);const lp=new THREE.Mesh(new THREE.LatheGeometry([[0,0],[1.5,0],[1.2,1.8],[.8,3],[0,3.2]].map(p=>new THREE.Vector2(p[0],p[1])),20),M(0xe8c36a,0x7a5a14));put(lp,b,0,.7,0);
 sph(.6,0xe8c36a,0,4.4,0,b,0x7a5a14);sph(.12,0x222222,0,5.1,0,b);cc(0,-12.8,2.6);
 box(5,1,1.4,0x5a2a18,0,1.4,-9.8,scene);cb(0,-9.8,2.6,.8);[-1.5,1.5].forEach(x=>{cyl(.1,.1,.5,0xfff0c0,x,2.15,-9.8,scene,8,0xffcc66)});
 warm(0,5,-6,1.6,32)}

/* 殿内：木鱼与签筒 */
{box(1.6,.12,1.6,0x7a1f18,5,1,-6);const f=sph(.45,0xb86a2a,5,1.45,-6);f.scale.set(1,.8,1.2);cc(5,-6,.8);
 box(1.6,.12,1.6,0x7a1f18,-5,1,-6);cyl(.3,.3,.9,0x8a4a22,-5,1.5,-6,scene,12);for(let i=0;i<7;i++){const s=box(.04,.7,.04,0xd8b070,-5+(i-3)*.07,2.2,-6);s.rotation.z=(i-3)*.07}cc(-5,-6,.8)}

/* ========== 大观音像 ========== */
const statue=new THREE.Group();statue.position.set(0,0,-38);statue.scale.setScalar(1.7);scene.add(statue);
{const G=0xe8c36a,E=0x7a5a14,W=0xf4ecd8;cyl(5.5,6.5,1.4,0xffffff,0,.7,0,statue,24,0,mkStone(6,2,50));
 for(let i=0;i<14;i++){const a=i/14*6.28,pg=new THREE.Group();pg.rotation.y=a;statue.add(pg);const p=cone(.9,2.4,0xf0a8c0,4.6,1.9,0,pg,6,0x6a2a40);p.scale.z=.45;p.rotation.z=-1.05}
 cyl(3.4,4.4,.6,0xcfa84a,0,1.7,0,statue,24,E);
 put(new THREE.Mesh(new THREE.LatheGeometry([[0,0],[3.4,0],[3.1,2],[2.3,5],[1.8,8],[1.3,9.4],[.9,10],[0,10.2]].map(p=>new THREE.Vector2(p[0],p[1])),28),M(W,0x303028)),statue,0,2,0);
 const sh=new THREE.Mesh(new THREE.TorusGeometry(1.6,.28,8,24),M(G,E));sh.rotation.x=Math.PI/2;put(sh,statue,0,10,0);
 sph(1.25,W,0,12.4,0,statue,0x383830);cone(.18,.9,0x222230,0,13.9,0,statue,8);sph(.5,0x222230,0,13.5,0,statue);
 const cr=new THREE.Mesh(new THREE.TorusGeometry(1.05,.12,6,16),M(G,E));cr.rotation.x=Math.PI/2;put(cr,statue,0,13.2,0);
 const halo=new THREE.Mesh(new THREE.TorusGeometry(2.8,.12,8,48),M(G,0xffcc55));put(halo,statue,0,12.8,-.7);
 const aura=new THREE.Mesh(new THREE.CircleGeometry(2.7,32),new THREE.MeshBasicMaterial({color:0xffe9a0,transparent:true,opacity:.16,side:THREE.DoubleSide}));aura.position.set(0,12.8,-.75);statue.add(aura);
 sph(.55,W,0,9,2.2,statue,0x222222);cyl(.45,.45,.9,G,.5,9,1.6,statue,10,E);
 const l=new THREE.SpotLight(0xffe0a0,2.4,80,.55,.6);l.position.set(0,12,-14);l.target.position.set(0,12,-38);scene.add(l,l.target);
 cc(0,-38,9.6)}

/* ========== 钟楼 ========== */
const bellG=new THREE.Group();
{const g=new THREE.Group();g.position.set(-15,0,12);scene.add(g);const red=mkRed(1,2);
