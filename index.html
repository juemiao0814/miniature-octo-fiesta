<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="screen-orientation" content="landscape">
<title>3D云游郑州大观音寺</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#0c0a14;font-family:"Noto Serif SC","Songti SC",SimSun,serif;color:#f0e2c0;touch-action:none}
canvas{display:block}
#start{position:fixed;inset:0;background:radial-gradient(#3a2418,#0c0a14);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:9;text-align:center;padding:20px}
#start h1{color:#e8c36a;letter-spacing:8px;font-size:30px}
#start p{opacity:.7;font-size:13px;letter-spacing:2px}
input{background:#14100c;border:1px solid #6a5230;color:#f0e2c0;padding:10px 14px;border-radius:8px;font:inherit;width:240px;text-align:center}
.cols{display:flex;gap:10px}
.cols button{width:70px;padding:8px 0;border-radius:18px;border:2px solid #6a5230;color:#fff;font:inherit;cursor:pointer;font-size:13px}
.cols button.on{border-color:#e8c36a;box-shadow:0 0 12px #e8c36a}
.go{background:#8a2f1f;color:#fff;border:1px solid #e8c36a;padding:10px 30px;border-radius:24px;font:inherit;cursor:pointer;letter-spacing:4px;margin:4px}
#hud{position:fixed;top:10px;left:12px;font-size:12px;line-height:1.7;opacity:.85;text-shadow:0 1px 4px #000;pointer-events:none}
#quest{position:fixed;top:10px;right:12px;background:#0008;border:1px solid #6a5230;border-radius:10px;padding:8px 12px;font-size:12px;line-height:1.8;pointer-events:none}
#quest b{color:#e8c36a;display:block;margin-bottom:2px}
#quest .ok{color:#8fe08f;text-decoration:line-through;opacity:.8}
#act{position:fixed;bottom:34px;left:50%;transform:translateX(-50%);display:none;background:#8a2f1f;color:#fff;border:1px solid #e8c36a;padding:12px 30px;border-radius:26px;font:inherit;font-size:16px;letter-spacing:3px;cursor:pointer;z-index:5}
#toast{position:fixed;top:16%;left:50%;transform:translateX(-50%);background:#000b;border:1px solid #e8c36a;padding:10px 22px;border-radius:10px;opacity:0;transition:.4s;pointer-events:none;text-align:center;max-width:85%;z-index:6}
#tl{position:fixed;top:56px;left:12px;z-index:7;display:flex;flex-direction:column;gap:6px;align-items:flex-start;max-width:calc(100vw - 150px)}
#music{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;background:#0008;border:1px solid #6a5230;border-radius:16px;padding:5px 12px;font-size:12px}
#bar{display:none;gap:6px;flex-wrap:wrap}
.pill{background:#0008;border:1px solid #6a5230;border-radius:16px;padding:5px 12px;font:inherit;font-size:12px;color:#f0e2c0;cursor:pointer}
.ovl{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:8}
.ovl .card{background:#1d1610;border:1px solid #e8c36a;border-radius:14px;padding:18px;max-width:440px;width:92%;max-height:84vh;overflow:auto;line-height:1.8;font-size:13px}
.ovl h3{color:#e8c36a;letter-spacing:4px;text-align:center;margin-bottom:8px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:10px}
.tabs button{background:#14100c;border:1px solid #6a5230;color:#f0e2c0;border-radius:14px;padding:3px 12px;font:inherit;font-size:12px;cursor:pointer}
.tabs button.on{background:#8a2f1f;border-color:#e8c36a}
.g{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;align-items:center}.g span{opacity:.7}
.li{border-bottom:1px solid #3a2e20;padding:4px 0}.li small{opacity:.6;display:block}
#hello{color:#e8c36a;opacity:.9}
#music button{background:none;border:0;color:#f0e2c0;font:inherit;cursor:pointer;letter-spacing:2px}
#music input[type=range]{width:70px;padding:0;border:0;background:none;accent-color:#e8c36a}
#music.on #mnote{animation:spin 3s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
#joy{position:fixed;left:24px;bottom:30px;width:120px;height:120px;border-radius:50%;background:#ffffff18;border:1px solid #ffffff40;display:none}
#knob{position:absolute;left:40px;top:40px;width:40px;height:40px;border-radius:50%;background:#ffffff70}
#modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:8}
#modal .card{background:#1d1610;border:1px solid #e8c36a;border-radius:14px;padding:24px;max-width:340px;width:88%;text-align:center;line-height:1.8}
#modal h3{color:#e8c36a;letter-spacing:4px;margin-bottom:8px}
#modal p{font-size:14px;margin-bottom:12px;opacity:.9}


/* ===== 手机 / 横屏 / 安全区 ===== */
:root{--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
html,body{overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
input{-webkit-user-select:text;user-select:text}
button{touch-action:manipulation}
#start{justify-content:flex-start;overflow-y:auto}#start>:first-child{margin-top:auto}#start>:last-child{margin-bottom:auto}
#hud{left:calc(12px + var(--sl))}
#tl{left:calc(12px + var(--sl))}
#quest{right:calc(12px + var(--sr));top:calc(10px + var(--st));pointer-events:auto;cursor:pointer;z-index:3}
#quest b{white-space:nowrap}
#quest i{font-style:normal;display:inline-block;width:1.3em;opacity:.7}
#quest .ok{text-decoration:none;opacity:1}
#quest .ok i{color:#8fe08f;font-weight:700;opacity:1}
#quest .ok span{text-decoration:line-through;opacity:.75}
#quest .ok.new i{animation:tick .5s ease-out}
@keyframes tick{0%{transform:scale(2.6);opacity:0}100%{transform:scale(1);opacity:1}}
#quest.min .qs{display:none!important}
#coin{cursor:default;color:#ffe08a}
#coin.pulse{animation:pulse .6s}
@keyframes pulse{40%{transform:scale(1.25);box-shadow:0 0 12px #e8c36a}}
#bmus,#bfs{display:none}
#joy{left:calc(30px + var(--sl));bottom:calc(28px + var(--sb));width:132px;height:132px;opacity:.38;pointer-events:none;z-index:2;transition:opacity .15s}
#joy.on{opacity:1;background:#ffffff26}
#joy.run{border-color:#e8c36a;box-shadow:0 0 14px #e8c36a99}
#knob{left:calc(50% - 24px);top:calc(50% - 24px);width:48px;height:48px;will-change:transform}
.touch #joy{display:block}.touch #hud{display:none}
.touch #bmus,.touch #bfs{display:inline-block}
.touch #bar{order:-1}
.touch #tl{top:calc(8px + var(--st));max-width:calc(100vw - 200px - var(--sl))}
.touch #tl:not(.mopen) #music{display:none}
.touch .pill{padding:8px 13px;font-size:13px}
.touch #quest{font-size:11px;line-height:1.55;padding:6px 10px}
.touch #act{left:auto;right:calc(32px + var(--sr));bottom:calc(36px + var(--sb));transform:none;padding:16px 28px;font-size:18px;box-shadow:0 4px 18px #000a}
.touch .go{padding:12px 28px}
.touch .tabs button{padding:6px 14px;font-size:13px}
.ovl .card{touch-action:pan-y;-webkit-overflow-scrolling:touch;max-height:88vh;max-height:92dvh}
#rot{display:none;position:fixed;left:50%;bottom:calc(200px + var(--sb));transform:translateX(-50%);z-index:20;background:#000c;border:1px solid #e8c36a;border-radius:20px;padding:8px 16px;font-size:12px;white-space:nowrap}
@media(orientation:portrait){.touch #rot{display:block}}
@media(orientation:landscape){.touch #tl{max-width:calc(100vw - 300px - var(--sl))}.touch #quest .qs{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}}
@media(max-height:520px){#start{gap:8px;padding:10px calc(16px + var(--sr)) 10px calc(16px + var(--sl))}#start h1{font-size:22px;letter-spacing:6px}#start p{font-size:12px}input{padding:8px 12px}.go{padding:9px 26px}.ovl .card{padding:12px;line-height:1.6}.touch #toast{top:calc(10px + var(--st))}}
/* ===== 商店 / 供桌 ===== */
.it{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #3a2e20}
.it .ic{font-size:26px;width:36px;text-align:center;flex:none}
.it .tx{flex:1;min-width:0;line-height:1.5}
.it .tx small{display:block;opacity:.6;font-size:11px}
.buy{flex:none;min-width:76px;padding:9px 10px;border-radius:16px;border:1px solid #e8c36a;background:#8a2f1f;color:#fff;font:inherit;font-size:13px;cursor:pointer}
.buy.dis{opacity:.45;background:#3a3228}
#trc{text-align:center;margin-bottom:4px}
#trm{min-height:20px;text-align:center;color:#8fe08f;font-size:12px;margin-bottom:4px}
</style>
</head>
<body>
<div id="start">
  <h1>云游大观音寺</h1>
  <p>塑一个自己，入寺走一走</p><p id="hello"></p>
  <input id="nm" maxlength="8" placeholder="你的名字" value="游客">
  <div class="cols" id="cols">
    <button data-c="0x3f8f8a" style="background:#3f8f8a" class="on">青衣</button>
    <button data-c="0xe8e4d8" style="background:#b8b2a0">素白</button>
    <button data-c="0xd9a441" style="background:#d9a441">杏黄</button>
  </div>
  <button class="go" id="go">入　寺</button>
</div>
<div id="hud">WASD/方向键 移动　Shift 跑　拖动 转视角<br>E 互动　T 切换昼夜　M 音乐　P 个人中心　N 联机</div>
<div id="tl"><div id="music"><button id="mbtn"><span id="mnote">♪</span> <span id="mtxt">音乐：关</span></button><button id="mimp">导入歌曲</button><button id="msfx">音效：开</button><input type="range" id="mvol" min="0" max="100" value="50" title="音量"><small id="trk" style="width:100%;opacity:.7"></small></div>
<div id="bar"><span id="coin" class="pill">🪙 0</span><button class="pill" id="bmus">♪ 音乐</button><button class="pill" id="bpc">个人中心</button><button class="pill" id="bnet">联机</button><button class="pill" id="bfs">全屏</button><span id="online" class="pill" style="display:none;cursor:default"></span></div></div>
<input type="file" id="mfile" accept="audio/*" style="display:none">
<audio id="bgm" loop preload="auto" src="xilou-ernv.mp3"></audio>
<div id="quest"></div>
<button id="act"></button>
<div id="toast"></div>
<div id="joy"><div id="knob"></div></div>
<div id="modal"><div class="card"><h3 id="mt"></h3><p id="mp"></p><input id="mi" maxlength="24" placeholder="写下你的心愿"><div><button class="go" id="mok">确定</button><button class="go" id="mc" style="background:#3a3228">关闭</button></div></div></div>

<div class="ovl" id="pc"><div class="card"><h3>个人中心</h3><div class="tabs" id="ptabs"></div><div id="pbody"></div><div style="text-align:center;margin-top:10px"><button class="go" id="pclose">关闭</button></div></div></div>
<div class="ovl" id="np"><div class="card"><h3>联机共修</h3><div id="nstat" style="text-align:center;margin-bottom:8px"></div><input id="nurl" style="width:100%;margin-bottom:6px" placeholder="服务器 ws://..."><input id="nroom" style="width:100%;margin-bottom:8px" maxlength="16" placeholder="房间名"><div style="text-align:center"><button class="go" id="nws">连接服务器</button><button class="go" id="nloc" style="background:#3a5a3a">本机多标签</button><button class="go" id="noff" style="background:#3a3228">断开</button></div><p style="font-size:12px;opacity:.7;margin-top:8px">和朋友联机：在一台电脑上运行 server.js（node server.js），大家填同一个服务器地址和房间名。本机多标签：同一浏览器多开几个标签页即可互相看到，用来试玩。</p><div style="text-align:center"><button class="go" id="nclose" style="background:#3a3228">关闭</button></div></div></div>

<div class="ovl" id="tr"><div class="card"><h3 id="trt"></h3><div id="trc"></div><div id="trm"></div><div id="trb"></div><div style="text-align:center;margin-top:10px"><button class="go" id="trclose" style="background:#3a3228">关闭</button></div></div></div>
<div id="rot">📱 横屏玩更舒适：请把手机横过来（点一下关闭提示）</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=s=>document.querySelector(s),rnd=Math.random,keys={};
let robe=0x3f8f8a,started=false,modalOpen=false,night=true;
if(matchMedia('(pointer:coarse)').matches)document.body.classList.add('touch');
document.querySelectorAll('#cols button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#cols button').forEach(x=>x.classList.remove('on'));b.classList.add('on');robe=+b.dataset.c});
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

const dayStr=o=>{const d=new Date(Date.now()-o*864e5);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const P=Object.assign({name:'游客',robe:0x3f8f8a,visits:0,first:'',last:'',streak:0,sec:0,sit:0,bell:0,fish:0,lit:0,burn:0,bow:0,boat:0,sign:0,wish:0,talk:0,signs:[],mine:[],coin:60,merit:0,offer:0,bag:{},gift:{},day:{d:'',q:{},lamps:0,alt:{},sit:0,fc:0,bonus:0}},store.get('profile',{}));
const save=()=>store.set('profile',P);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
if(P.day.d!==dayStr(0))P.day={d:dayStr(0),q:{},lamps:0,alt:{},sit:0,fc:0,bonus:0};
P.day.alt=P.day.alt||{};P.day.sit=P.day.sit||0;P.day.fc=P.day.fc||0;P.bag=P.bag||{};P.gift=P.gift||{};
robe=P.robe;$('#nm').value=P.name;document.querySelectorAll('#cols button').forEach(b=>b.classList.toggle('on',+b.dataset.c===P.robe));
if(P.visits)$('#hello').textContent='欢迎回来，'+P.name+'　第 '+(P.visits+1)+' 次入寺　连续 '+(P.last===dayStr(0)||P.last===dayStr(1)?P.streak:0)+' 天';
setInterval(()=>{if(started&&!document.hidden){P.sec+=5;save()}},5000);
addEventListener('pagehide',save);

/* ========== 渲染器与贴图 ========== */
const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,400);
const ren=new THREE.WebGLRenderer({antialias:true});
ren.setSize(innerWidth,innerHeight);ren.setPixelRatio(Math.min(devicePixelRatio,coarse()?1.5:2));
ren.outputEncoding=THREE.sRGBEncoding;ren.toneMapping=THREE.ACESFilmicToneMapping;ren.toneMappingExposure=1.15;
ren.shadowMap.enabled=true;ren.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(ren.domElement);
function fit(){const w=innerWidth,h=innerHeight;cam.aspect=w/h;cam.fov=w/h<1?72:60;cam.updateProjectionMatrix();ren.setSize(w,h)}
addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,350));fit();
scene.fog=new THREE.FogExp2(0x15101c,.016);

function tex(w,h,draw,rx=1,ry=1){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);
 const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx,ry);t.encoding=THREE.sRGBEncoding;t.anisotropy=4;return t}
const mkGrass=(rx,ry)=>tex(256,256,(c,w,h)=>{c.fillStyle='#2f5030';c.fillRect(0,0,w,h);for(let i=0;i<3000;i++){c.fillStyle=`hsl(${90+rnd()*35},${30+rnd()*25}%,${14+rnd()*16}%)`;c.fillRect(rnd()*w,rnd()*h,2,4)}},rx,ry);
const mkStone=(rx,ry,b=46)=>tex(256,256,(c,w,h)=>{c.fillStyle=`hsl(35,5%,${b-20}%)`;c.fillRect(0,0,w,h);for(let y=0;y<4;y++)for(let x=0;x<4;x++){c.fillStyle=`hsl(35,${4+rnd()*6}%,${b+rnd()*14}%)`;c.fillRect(x*64+2,y*64+2,60,60)}for(let i=0;i<700;i++){c.fillStyle=`rgba(0,0,0,${rnd()*.14})`;c.fillRect(rnd()*w,rnd()*h,2,2)}},rx,ry);
const mkTile=(rx,ry)=>tex(128,128,(c,w,h)=>{c.fillStyle='#3a474e';c.fillRect(0,0,w,h);for(let x=0;x<w;x+=16){c.fillStyle='#232d33';c.fillRect(x,0,3,h)}for(let y=0;y<h;y+=16){c.fillStyle='#4a5a62';c.fillRect(0,y,w,2)}},rx,ry);
const mkRed=(rx,ry)=>tex(128,128,(c,w,h)=>{c.fillStyle='#9a2f22';c.fillRect(0,0,w,h);for(let i=0;i<60;i++){c.fillStyle=`rgba(${rnd()<.5?'0,0,0':'255,160,120'},${rnd()*.1})`;c.fillRect(rnd()*w,0,1+rnd()*2,h)}},rx,ry);
const mkSky=(stops)=>tex(8,256,(c,w,h)=>{const g=c.createLinearGradient(0,0,0,h);stops.forEach((s,i)=>g.addColorStop(i/(stops.length-1),s));c.fillStyle=g;c.fillRect(0,0,w,h)});

const M=(c,e=0,map=null)=>new THREE.MeshStandardMaterial({color:c,roughness:.85,emissive:e,emissiveIntensity:e?1:0,map});
function put(m,p,x,y,z,sh=true){m.position.set(x,y,z);m.castShadow=sh;m.receiveShadow=true;p.add(m);return m}
const box=(w,h,d,c,x,y,z,p=scene,e=0,map=null)=>put(new THREE.Mesh(new THREE.BoxGeometry(w,h,d),M(c,e,map)),p,x,y,z);
const cyl=(rt,rb,h,c,x,y,z,p=scene,seg=16,e=0,map=null)=>put(new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg),M(c,e,map)),p,x,y,z);
const sph=(r,c,x,y,z,p=scene,e=0)=>put(new THREE.Mesh(new THREE.SphereGeometry(r,16,12),M(c,e)),p,x,y,z);
const cone=(r,h,c,x,y,z,p=scene,seg=8,e=0)=>put(new THREE.Mesh(new THREE.ConeGeometry(r,h,seg),M(c,e)),p,x,y,z);
// 歇山式屋顶：四棱台，旋转45°对齐，z向压扁；四角起翘
const tileT=mkTile(8,2);
function roof(rb,rt,h,sz,x,y,z,p){const m=put(new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,4),M(0xffffff,0,tileT)),p,x,y,z);m.rotation.y=Math.PI/4;m.scale.z=sz;
 const a=rb/Math.SQRT2;[-1,1].forEach(sx=>[-1,1].forEach(s2=>{const c=cone(.3,1.8,0x2a3238,sx*a,y-h/2+.3,s2*a*sz,p);c.rotation.z=-sx*.7;c.rotation.x=s2*.7}))}

/* ========== 光照、天空、昼夜 ========== */
const hemi=new THREE.HemisphereLight(0x7080b8,0x2a1c14,.75);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xbcc8ff,.45);sun.position.set(-30,60,25);sun.castShadow=true;
sun.shadow.mapSize.set(coarse()?1024:2048,coarse()?1024:2048);Object.assign(sun.shadow.camera,{left:-70,right:70,top:70,bottom:-70,near:1,far:200});sun.shadow.bias=-.0005;scene.add(sun);
function coarse(){return matchMedia('(pointer:coarse)').matches}
const pl=[];function warm(x,y,z,i=1.2,d=34){const l=new THREE.PointLight(0xffb060,i,d);l.position.set(x,y,z);l.userData.b=i;scene.add(l);pl.push(l);return l}
const skyT=[mkSky(['#04050c','#14121f','#3a2428','#6a3a30']),mkSky(['#3f78c8','#86b4e6','#d4e2ee','#f4e6cc'])];
const sky=new THREE.Mesh(new THREE.SphereGeometry(300,24,16),new THREE.MeshBasicMaterial({map:skyT[0],side:THREE.BackSide,fog:false}));scene.add(sky);
const stars=(()=>{const g=new THREE.BufferGeometry(),a=[];for(let i=0;i<700;i++){const t=rnd()*6.28,e=.15+rnd()*1.2,r=280;a.push(Math.cos(t)*Math.cos(e)*r,Math.sin(e)*r,Math.sin(t)*Math.cos(e)*r)}
 g.setAttribute('position',new THREE.Float32BufferAttribute(a,3));const p=new THREE.Points(g,new THREE.PointsMaterial({color:0xfff2c8,size:1.4,fog:false,sizeAttenuation:false}));scene.add(p);return p})();
const moonM=new THREE.Mesh(new THREE.SphereGeometry(9,24,16),new THREE.MeshBasicMaterial({color:0xfff3c8,fog:false}));moonM.position.set(-120,130,-200);scene.add(moonM);

  let sure=0;$('#pclr').onclick=e=>{if(!sure){sure=1;e.target.textContent='再点一次确认清除';return}['profile','wishes','net','sfxVol','sfxOn','mvol','mwant'].forEach(k=>{try{localStorage.removeItem(k)}catch(x){}});location.reload()}}}

/* ========== 联机（服务器 / 本机多标签） ========== */
const net={mode:'off',ws:null,bc:null,id:Math.random().toString(36).slice(2,8),acc:0,hb:0,lx:0,lz:0,lf:0},peers=new Map();
const nset=Object.assign({url:/^https?:/.test(location.protocol)?(location.protocol==='https:'?'wss://':'ws://')+location.host:'ws://localhost:8080',room:'main',mode:'off'},store.get('net',{}));
const nsend=o=>{o.id=net.id;if(net.mode==='ws'){net.ws&&net.ws.readyState===1&&net.ws.send(JSON.stringify(o))}else if(net.mode==='local')net.bc.postMessage(o)};
const seatTaken=i=>[...peers.values()].some(p=>p.seat===i);
const netInfo=()=>nsend({t:'info',name:P.name,robe,seat:me.seat,x:me.x,z:me.z,f:me.face});
function addPeer(m){let p=peers.get(m.id);
 if(!p){const o=makeChar(m.robe||0x3f8f8a,false,m.name||'同修');scene.add(o.g);p={o,x:m.x||0,z:m.z||0,f:m.f||0,tx:m.x||0,tz:m.z||0,tf:m.f||0,w:0,walk:0,sit:0,seat:-1,name:m.name||'同修'};peers.set(m.id,p);toast(p.name+' 入寺了')}
 else if(m.name&&m.name!==p.name){p.name=m.name;p.o.g.remove(p.o.lab);p.o.g.add(p.o.lab=spriteText(m.name))}
 if(m.x!==undefined){p.tx=m.x;p.tz=m.z;p.tf=m.f}if(m.seat!==undefined)p.seat=m.seat;p.t=performance.now();netUI()}
function onNet(m){if(m.t==='welcome'){net.id=m.id;m.players.forEach(q=>addPeer(q));return}if(m.id===net.id)return;const p=peers.get(m.id);
 if(m.t==='bye'){if(p){scene.remove(p.o.g);peers.delete(m.id);toast(p.name+' 离开了');netUI()}}
 else if(m.t==='hello')netInfo();
 else if(m.t==='deny'){if(me.seat===m.seat){standUp();toast('这个蒲团刚被别人坐了')}}
 else if(m.t==='info')addPeer(m);
 else if(m.t==='pos'){if(p){p.tx=m.x;p.tz=m.z;p.tf=m.f;p.w=m.w;p.t=performance.now()}else addPeer(m)}
 else if(m.t==='seat'&&p){p.seat=m.seat;p.t=performance.now()}}
function netTick(dt){if(net.mode==='off')return;const nw=performance.now();
 net.acc+=dt;if(net.acc>.1&&me.o){net.acc=0;const ch=Math.abs(me.x-net.lx)+Math.abs(me.z-net.lz)+Math.abs(me.face-net.lf)>.01;if(ch||++net.hb>10){net.hb=0;net.lx=me.x;net.lz=me.z;net.lf=me.face;nsend({t:'pos',x:+me.x.toFixed(2),z:+me.z.toFixed(2),f:+me.face.toFixed(2),w:moving})}}
 peers.forEach((p,id)=>{if(nw-p.t>12000){scene.remove(p.o.g);peers.delete(id);netUI();return}
  const sp=p.seat>=0?SEATS[p.seat]:null;if(sp){p.tx=sp.x;p.tz=sp.z;p.tf=sp.f}
  const k=Math.min(1,dt*10),dx=p.tx-p.x,dz=p.tz-p.z;p.x+=dx*k;p.z+=dz*k;p.f+=Math.atan2(Math.sin(p.tf-p.f),Math.cos(p.tf-p.f))*k;
  const mvg=Math.hypot(dx,dz)>.05&&!sp;if(mvg)p.walk+=dt*9;p.sit+=((sp?1:0)-p.sit)*Math.min(1,dt*6);
  const g=p.o.g;g.position.set(p.x,hgt(p.x,p.z),p.z);g.rotation.y=p.f;animChar(p.o,p.walk,mvg?1:0,0,p.sit)})}
setInterval(()=>{if(net.mode!=='off'&&me.o)nsend({t:'pos',x:+me.x.toFixed(2),z:+me.z.toFixed(2),f:+me.face.toFixed(2),w:0})},2000);
function netOff(msg){if(net.ws){net.ws.onclose=null;net.ws.close();net.ws=null}if(net.bc){nsend({t:'bye'});net.bc.close();net.bc=null}net.mode='off';peers.forEach(p=>scene.remove(p.o.g));peers.clear();if(msg)toast(msg);netUI()}
function netOn(mode){netOff();nset.url=$('#nurl').value.trim()||nset.url;nset.room=$('#nroom').value.trim()||nset.room;nset.mode=mode;store.set('net',nset);
 if(mode==='local'){if(!window.BroadcastChannel)return toast('此浏览器不支持本机联机');net.mode='local';net.bc=new BroadcastChannel('dgys-'+nset.room);net.bc.onmessage=e=>onNet(e.data);nsend({t:'hello'});netInfo();toast('本机联机已开：再开一个标签页试试')}
 else{let ws;try{ws=new WebSocket(nset.url)}catch(e){return toast('服务器地址不对')}net.ws=ws;net.mode='ws';
  const to=setTimeout(()=>{if(ws.readyState!==1)netOff('连接服务器超时，请检查地址，以及 server.js 是否在运行')},6000);
  ws.onopen=()=>{clearTimeout(to);ws.send(JSON.stringify({t:'join',room:nset.room,name:P.name,robe,seat:me.seat,x:me.x,z:me.z,f:me.face}));toast('已连入房间「'+nset.room+'」');netUI()};
  ws.onmessage=e=>{try{onNet(JSON.parse(e.data))}catch(x){}};
  ws.onclose=()=>{clearTimeout(to);if(net.ws===ws)netOff('与服务器断开')}}
 netUI()}
function netUI(){const n=peers.size+1,on=net.mode==='local'||(net.mode==='ws'&&net.ws&&net.ws.readyState===1);$('#online').style.display=on?'':'none';$('#online').textContent='同修 '+n+' 人';$('#nstat').textContent=on?(net.mode==='ws'?'已连接服务器':'本机多标签联机')+' · 房间「'+nset.room+'」· 在线 '+n+' 人':'未联机'}
function openNP(){$('#nurl').value=nset.url;$('#nroom').value=nset.room;netUI();openP('#np')}
$('#nws').onclick=()=>netOn('ws');$('#nloc').onclick=()=>netOn('local');
$('#noff').onclick=()=>{nset.mode='off';store.set('net',nset);netOff('已断开联机')};
addEventListener('pagehide',()=>{if(net.mode!=='off')nsend({t:'bye'})});
loop();
</script>
