<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>作业提交 - 成长OS</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
<div class="header-row">
<div>
<h1>作业提交</h1>
<p><a href="index.html" class="back-link">← 返回首页</a></p>
</div>
<div class="user-box">
<span id="usernameDisplay"></span>
<button onclick="doLogout()">退出登录</button>
</div>
</div>
</header>

<section class="page-body">

<div class="card wide">
<h2>提交新作业</h2>
<div class="form-row">
<input type="text" id="title" placeholder="作业标题" style="flex:1">
</div>
<div class="form-row">
<textarea id="content" placeholder="作业内容(文字，可选)" rows="4" style="flex:1;padding:8px;border:1px solid #ddd;border-radius:8px;"></textarea>
</div>
<div class="form-row">
<input type="file" id="file">
<button onclick="submitHomework()">提交</button>
</div>
<p class="auth-msg" id="msg"></p>
</div>

<div class="card wide">
<h2>提交历史</h2>
<ul id="homeworkList"><li>加载中...</li></ul>
</div>

</section>

<script src="js/common.js"></script>
<script src="js/homework.js"></script>

</body>
</html>
